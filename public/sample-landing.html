<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Personalized Landing</title>
  <style>
    body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;}
    .bg{position:absolute;top:0;left:0;width:100%;height:100%;background:url('https://via.placeholder.com/1920x1080') no-repeat center/cover;animation:scroll 30s linear infinite;}
    @keyframes scroll{0%{background-position:0% 0%;}100%{background-position:100% 0%;}}
    .video-wrapper{position:relative;z-index:2;width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 0 20px rgba(255,255,255,0.3);}
    video{width:100%;height:100%;object-fit:cover;}
    .cta{margin-top:20px;padding:12px 24px;background:#4f46e5;border:none;border-radius:6px;color:#fff;cursor:pointer;}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content" style="text-align:center;z-index:2;">
    <div class="video-wrapper">
      <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay muted loop></video>
    </div>
    <button class="cta" onclick="window.location.href='https://example.com'">Visit Company</button>
  </div>
</body>
</html>
