<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {font-family: Arial, sans-serif; margin:0; padding:20px; background:#f9f9f9;}
    .container {max-width:600px; margin:auto; background:#fff; padding:30px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    h1 {color:#4f46e5;}
    .cta {display:inline-block; margin-top:20px; padding:12px 24px; background:#4f46e5; color:#fff; text-decoration:none; border-radius:4px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello {{first_name}},</h1>
    <p>I'm reaching out because I think {{company}} could benefit from a quick video demo that shows how we can boost your outreach conversion.</p>
    <p><a href="{{landing_url}}" class="cta">Watch Your Personalized Landing Page</a></p>
    <p>Best,<br/>{{sender_name}}</p>
  </div>
</body>
</html>
